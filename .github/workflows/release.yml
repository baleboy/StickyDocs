name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.3). If empty, derived from tag or Xcode setting.'
        required: false
        default: ''

permissions:
  contents: write

env:
  XCODE_PROJECT: StickyDocs/StickyDocs.xcodeproj
  SCHEME: StickyDocs
  APP_NAME: StickyDocs
  TEAM_ID: 8HG4D44UZQ

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=""
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Write Secrets.swift
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET secrets are required."
            exit 1
          fi
          cat > StickyDocs/StickyDocs/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
              static let googleClientID = "$GOOGLE_CLIENT_ID"
              static let googleClientSecret = "$GOOGLE_CLIENT_SECRET"
          }
          EOF

      - name: Detect signing config
        id: signing
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}" ] && [ -n "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.AC_API_KEY_BASE64 }}" ] && [ -n "${{ secrets.AC_API_KEY_ID }}" ] && [ -n "${{ secrets.AC_API_ISSUER_ID }}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        if: steps.signing.outputs.notarize == 'true'
        env:
          AC_API_KEY_B64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$AC_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          echo "AC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/${APP_NAME}.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          EXTRA=()
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            EXTRA+=("MARKETING_VERSION=${{ steps.ver.outputs.version }}")
            EXTRA+=("CURRENT_PROJECT_VERSION=${{ github.run_number }}")
          fi
          # Archive unsigned, then sign post-hoc with codesign. This avoids the
          # Developer ID provisioning profile dance for sandboxed Mac apps.
          EXTRA+=("CODE_SIGNING_ALLOWED=NO")
          EXTRA+=("CODE_SIGNING_REQUIRED=NO")
          EXTRA+=("CODE_SIGN_IDENTITY=")
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            "${EXTRA[@]}"

      - name: Export and sign
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_DIR"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

          APP_PATH="$EXPORT_DIR/${APP_NAME}.app"
          cp -R "$ARCHIVE_PATH/Products/Applications/${APP_NAME}.app" "$APP_PATH"

          if [ "${{ steps.signing.outputs.sign }}" != "true" ]; then
            ls -la "$EXPORT_DIR"
            exit 0
          fi

          IDENTITY="Developer ID Application"
          ENTITLEMENTS="StickyDocs/StickyDocs/StickyDocs.entitlements"

          # Embed the Developer ID provisioning profile. Required for sandboxed
          # apps distributed outside the App Store; launchd refuses to spawn
          # them otherwise (POSIX 153 / spawn failed).
          PROFILE_B64='${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}'
          if [ -z "$PROFILE_B64" ]; then
            echo "::error::MACOS_PROVISIONING_PROFILE_BASE64 secret is required for signed builds."
            exit 1
          fi
          echo "$PROFILE_B64" | base64 --decode > "$APP_PATH/Contents/embedded.provisionprofile"

          # Sign inside-out: nested bundles/dylibs first, then helpers, then main.
          # -depth gives post-order traversal so children are signed before parents.
          find "$APP_PATH" \
            \( -name "*.dylib" -o -name "*.framework" -o -name "*.xpc" \
               -o -name "*.bundle" -o -name "*.app" \) \
            -depth | while read -r item; do
            if [ "$item" != "$APP_PATH" ]; then
              echo "Signing nested: $item"
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$item"
            fi
          done

          # Sign any loose Mach-O executables (e.g. Sparkle's Autoupdate helper)
          # that live outside the main MacOS dir.
          find "$APP_PATH/Contents" -type f -perm -u+x \
            ! -path "$APP_PATH/Contents/MacOS/*" | while read -r exe; do
            if file "$exe" | grep -q "Mach-O"; then
              echo "Signing helper executable: $exe"
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$exe"
            fi
          done

          # Sign the main bundle with entitlements.
          echo "Signing main bundle: $APP_PATH"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$IDENTITY" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvv "$APP_PATH" 2>&1 | sed 's/^/  /'

      - name: Notarize and staple
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          APP_PATH="$EXPORT_DIR/${APP_NAME}.app"
          ZIP_PATH="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --key "$AC_API_KEY_PATH" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait 2>&1)
          SUBMIT_RC=$?
          echo "$SUBMIT_OUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | awk '/^  id:/ {print $2; exit}')
          if [ $SUBMIT_RC -ne 0 ] || echo "$SUBMIT_OUT" | grep -q 'status: Invalid'; then
            echo "::group::Notarization log for $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$AC_API_KEY_PATH" \
              --key-id "$AC_API_KEY_ID" \
              --issuer "$AC_API_ISSUER_ID" || true
            echo "::endgroup::"
            exit 1
          fi
          set -e

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package zip
        id: package
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ -z "$V" ]; then V="dev"; fi
          OUT="$RUNNER_TEMP/${APP_NAME}-${V}-macOS.zip"
          ditto -c -k --keepParent "$EXPORT_DIR/${APP_NAME}.app" "$OUT"
          echo "zip_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          draft: false
          generate_release_notes: true

      - name: Publish appcast
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
          SPARKLE_VERSION: "2.9.1"
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ github.run_number }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY_BASE64" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY_BASE64 secret is required to publish the appcast."
            exit 1
          fi

          # Fetch sign_update from the Sparkle release tarball. Pinned to the
          # version in Package.resolved so the signing tool matches the SDK.
          SPARKLE_TARBALL="Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -sSL -o "$RUNNER_TEMP/$SPARKLE_TARBALL" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/${SPARKLE_TARBALL}"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/$SPARKLE_TARBALL" -C "$RUNNER_TEMP/sparkle"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update"
          chmod +x "$SIGN_UPDATE"

          # Sign the released zip with the EdDSA private key. sign_update
          # in Sparkle 2.9.1 rejects the old -s flag; the supported path is
          # --ed-key-file. Write the key with 600 perms, shred after use.
          KEY_FILE="$RUNNER_TEMP/sparkle_priv.key"
          umask 077
          echo "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          SIG_LINE=$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "$ZIP_PATH")
          rm -P "$KEY_FILE"
          echo "Signature line: $SIG_LINE"
          ED_SIG=$(echo "$SIG_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIG_LINE" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIG" ] || [ -z "$LENGTH" ]; then
            echo "::error::Could not parse sign_update output."
            exit 1
          fi

          MIN_OS=$(defaults read "$EXPORT_DIR/${APP_NAME}.app/Contents/Info" LSMinimumSystemVersion 2>/dev/null || echo "14.0")
          ENCLOSURE_URL="https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}"
          PUB_DATE=$(date -R)

          # Alpha channel: tags like v1.0.0-alpha.1 (or any pre-release suffix
          # after a hyphen) ship to alpha; bare semver to stable.
          IS_ALPHA=false
          if [[ "$TAG" == *-* ]]; then IS_ALPHA=true; fi

          # Build the <item> XML with printf — avoids YAML-vs-heredoc indentation
          # traps. Whitespace inside is harmless.
          ITEM_FILE="$RUNNER_TEMP/item.xml"
          {
            printf '        <item>\n'
            printf '            <title>Version %s</title>\n' "$VERSION"
            printf '            <pubDate>%s</pubDate>\n' "$PUB_DATE"
            printf '            <sparkle:version>%s</sparkle:version>\n' "$BUILD"
            printf '            <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$VERSION"
            printf '            <sparkle:minimumSystemVersion>%s</sparkle:minimumSystemVersion>\n' "$MIN_OS"
            if [ "$IS_ALPHA" = "true" ]; then
              printf '            <sparkle:channel>alpha</sparkle:channel>\n'
            fi
            printf '            <enclosure url="%s" sparkle:edSignature="%s" length="%s" type="application/octet-stream"/>\n' \
              "$ENCLOSURE_URL" "$ED_SIG" "$LENGTH"
            printf '        </item>\n'
          } > "$ITEM_FILE"
          cat "$ITEM_FILE"

          # Switch to main so the appcast commit lives on a branch, not on
          # detached HEAD at the tag.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          # Insert the new item just before </channel>. YAML strips the common
          # leading indent before bash sees this block, so the Python heredoc
          # body lands at column 0 by the time Python parses it.
          ITEM_FILE="$ITEM_FILE" python3 <<'PY'
          import os, pathlib
          item = pathlib.Path(os.environ["ITEM_FILE"]).read_text()
          p = pathlib.Path("docs/appcast.xml")
          xml = p.read_text()
          if item.strip() in xml:
              raise SystemExit("Item already in appcast; nothing to publish.")
          p.write_text(xml.replace("</channel>", item + "    </channel>", 1))
          PY

          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast change to commit"
          else
            git commit -m "Publish ${TAG} to appcast"
            git push origin main
          fi

      - name: Clean up keychain
        if: always() && steps.signing.outputs.sign == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
